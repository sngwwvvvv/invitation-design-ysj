<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intro section image stage</title>
  <style>
    :root { --platinum:#f0f4f8; --navy:#0a2d54; --green:#43a64e; --slate:#64748b; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:max-content; min-width:0; background:transparent; }
    #intro-stage { position:relative; overflow:hidden; background:var(--slate); font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif; }
    #intro-stage::before { position:absolute; inset:4px; content:""; background:linear-gradient(180deg,rgba(240,244,248,.82),rgba(240,244,248,.58)),url("../img/reflection_background.png") center/cover no-repeat; filter:brightness(1.12) saturate(.78); box-shadow:inset 0 1px 0 rgba(255,255,255,.92),inset 0 -36px 60px rgba(10,45,84,.17),inset 12px 0 24px rgba(10,45,84,.06),0 6px 18px rgba(10,45,84,.32); }
    #intro-stage::after { position:absolute; inset:4px; z-index:1; border:1px solid rgba(10,45,84,.14); content:""; pointer-events:none; }
    .intro-content { position:relative; z-index:2; text-align:center; }
    .brand-logo { display:block; width:200px; max-width:70%; height:auto; margin:0 auto 28px; }
    .intro-title { margin:0 0 26px; color:var(--navy); font-weight:800; letter-spacing:-.04em; line-height:1.45; }
    .event-pill { display:flex; width:var(--intro-copy-width); align-items:center; justify-content:center; gap:6px; margin:0 auto 26px; padding:8px 12px; border:1px solid rgba(10,45,84,.16); border-radius:999px; background:var(--platinum); color:var(--navy); font-weight:700; letter-spacing:-.03em; line-height:1.4; }
    .event-copy { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; }
    .event-icon { color:var(--green); }
    .invitation-message { width:var(--intro-copy-width); margin:0 auto; color:var(--navy); font-weight:700; letter-spacing:-.01em; line-height:2; text-align:left; text-shadow:0 1px 0 rgba(240,244,248,.5); }
    .invitation-message p { margin:0 0 20px; }
    .invitation-signature { margin-top:26px !important; font-size:15px; line-height:1.8; text-align:right; }
    .invitation-signature span { display:block; }
    #intro-stage[data-width="360"] { --intro-copy-width:312px; width:360px; padding:56px 24px 64px; }
    #intro-stage[data-width="360"] .intro-title { font-size:24px; }
    #intro-stage[data-width="360"] .event-pill { font-size:15px; }
    #intro-stage[data-width="360"] .event-copy { flex-direction:column; }
    #intro-stage[data-width="360"] .event-separator { display:none; }
    #intro-stage[data-width="360"] .invitation-message { font-size:16px; }
    #intro-stage[data-width="480"] { --intro-copy-width:408px; width:480px; padding:64px 36px 70px; }
    #intro-stage[data-width="480"] .intro-title { font-size:28px; }
    #intro-stage[data-width="480"] .event-pill { font-size:16px; }
    #intro-stage[data-width="480"] .invitation-message { font-size:17px; }
    #intro-stage[data-width="640"] { --intro-copy-width:480px; width:640px; padding:72px 48px 76px; }
    #intro-stage[data-width="640"] .intro-title { font-size:32px; }
    #intro-stage[data-width="640"] .event-pill { font-size:16px; }
    #intro-stage[data-width="640"] .invitation-message { font-size:18px; }
    template { display:none; }
  </style>
</head>
<body>
  <main id="intro-stage" data-width="640"></main>
  <template id="copy-360">
    <div class="intro-content">
      <img class="brand-logo" src="../img/hoyeon_logo_horizontal.png" alt="호연회계법인">
      <div class="intro-title">“호연회계법인”에서<br>새로운 시작을 알려드립니다.</div>
      <div class="event-pill"><span aria-hidden="true" class="event-icon">▣</span><span class="event-copy"><span class="event-date">2026년 8월 19일 (수)</span><span aria-hidden="true" class="event-separator"> · </span><span class="event-time">오전 10시 ~ 오후 9시</span></span></div>
      <div class="invitation-message">
        <p>안녕하세요.</p>
        <p>오랜 공직생활을 마치고<br>호연회계법인에서 세무사로<br>새로운 출발을 하게 되었습니다.</p>
        <p>그동안 함께해 주신 많은 분들의<br>관심과 격려 덕분에 무사히<br>한 걸음을 내딛게 되었습니다.</p>
        <p>거창한 약속보다는, 제게 주어진<br>경험을 바탕으로 매 순간 솔직하고<br>치열하게 고민하며 납세자에게<br>진정으로 도움이 되는 사람으로<br>하루하루 살아가려 합니다.</p>
        <p>이 글을 받으신 모든 분들의 일상에<br>건강과 평안이 가득하시길 기원합니다.<br>새롭게 시작하는 자리에<br>귀한 발걸음으로 함께해 주시고<br>응원해 주시면 감사하겠습니다.</p>
        <p class="invitation-signature"><span>2026년 8월</span><span>호연회계법인 부대표</span><span>세무사 윤성중 드림</span></p>
      </div>
    </div>
  </template>

  <script>
    const width = [360, 480, 640].includes(Number(new URLSearchParams(location.search).get('width')))
      ? Number(new URLSearchParams(location.search).get('width')) : 640;
    const stage = document.querySelector('#intro-stage');
    stage.dataset.width = String(width);
    stage.append(document.querySelector(`#copy-${width}`).content.cloneNode(true));
  </script>
